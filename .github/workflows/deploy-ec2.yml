# Optional: deploy to your own AWS EC2 server instead of Vercel + Render.
# Run it by hand from the Actions tab once the server is set up (deploy/ec2/README.md).
# It builds both Docker images, publishes them to ghcr.io and restarts the server.

name: Deploy to EC2

on:
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check repository settings
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          # Image names must be lowercase.
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/iitr-chess-api:latest
            ghcr.io/${{ env.OWNER }}/iitr-chess-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the website image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ env.OWNER }}/iitr-chess-web:latest
            ghcr.io/${{ env.OWNER }}/iitr-chess-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Set the EC2_HOST and EC2_SSH_KEY repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy the compose file and Caddyfile
        run: scp -i ~/.ssh/ec2 deploy/ec2/docker-compose.yml deploy/ec2/Caddyfile "$SSH_USER@$HOST:/opt/iitr-chess/"

      - name: Pull the new images and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes over stdin, never on a command line.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2 "$SSH_USER@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/ec2 "$SSH_USER@$HOST" '
            set -e
            cd /opt/iitr-chess
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            docker compose ps
          '
